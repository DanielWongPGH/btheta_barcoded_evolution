# CHANGE THESE FOR YOUR SYSTEM(S) CONFIG
# Package versions below reproduce the local Python analysis environment.
name: btheta-barcoded-evolution
channels:
  - conda-forge
dependencies:
  - python=3.9
  # Keep NumPy 1.x for binary compatibility with compiled analysis dependencies.
  - numpy=1.26.4
  - scipy=1.13.1
  - matplotlib=3.9.4
  - pandas=2.2.3
  - numexpr=2.8.4
  - bottleneck=1.3.6
  - seaborn=0.13.2
  - statsmodels=0.14.0
  - biopython=1.85
  - openpyxl=3.1.5
  - pyyaml=6.0.3
  - jupyterlab=4.5.10
  - nbconvert=7.17.1
  - pip
  - pip:
      - pygenomeviz==0.4.4
