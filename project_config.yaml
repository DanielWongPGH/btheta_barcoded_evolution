# CHANGE THESE FOR YOUR SYSTEM(S) CONFIG
raw_processing:
  barseq:
    fastq_dir: /path/to/fastq/files
    manifest_fastq_dirs:
      E1_barseq: /path/to/E1_barseq_fastq
      E2_barseq: /path/to/E2_barseq_fastq
      EV_barseq: /path/to/vitro_barseq_fastq
      rebarseq: /path/to/rebarseq_fastq
    output_dir: /path/to/barseq/output
    bartender_path: /path/to/bartender-1.1/build
    execution:
      scheduler: slurm # slurm or local
      load_modules: true
      python: python3
    slurm:
      partition: normal
      memory: 16G
      time: "30"
    modules:
      python: py-scipy/1.12.0_py312
      viz: viz
      matplotlib: py-matplotlib/3.8.3_py312
      gcc: gcc/9.1.0
    primers:
      R1: TGCAGTGTCG
      R2: AAATGCTGTT
    bartender:
      extractor_executable: bartender_extractor_com
      cluster_executable: bartender_single_com
      pattern: GACT[5]TT[5]AC[5]AA[5]TTGC
      quality_char: "?"
      seed_length: 5
      distance: 2
      umi_range: 0,16

  isolates:
    fastq_dir: /path/to/isolate/fastq
    manifest_fastq_dirs:
      E1_isolates: /path/to/E1_isolates_fastq
    output_dir: /path/to/isolate/output
    trimmomatic:
      jar: /path/to/Trimmomatic-0.36/trimmomatic-0.36.jar
      adapters: /path/to/Trimmomatic-0.36/adapters/TruSeq2-PE.fa
    breseq:
      path: /path/to/breseq-0.35.7/bin/breseq
    delly:
      singularity_image: /path/to/delly_v1.3.1.sif
    reference:
      genbank: /path/to/BtVPI-5482.gbk
    slurm:
      partition: normal
      trim: {time: "0:30:00", mem_per_cpu: 16G, cpus: 1}
      breseq: {time: "6:00:00", mem: 32G}
      delly: {time: "2:00:00", mem: 16G}
    modules:
      R: R
      biology: biology
      samtools: samtools
      system: system
      ncurses: ncurses/6.0
      bowtie2: bowtie2
      numpy: py-numpy/1.14.3_py27
    trimmomatic_params:
      illumina_clip: 2:30:10:2:keepBothReads
      leading: 3
      trailing: 3
      minlen: 36
    breseq_params:
      polymorphism_reject_indel_homopolymer_length: 0
      polymorphism_reject_surrounding_homopolymer_length: 0
      polymorphism_score_cutoff: 2
      polymorphism_minimum_variant_coverage_each_strand: 0
    delly_params:
      min_mapping_quality: 1

  metagenomics:
    scratch_dir: /path/to/scratch/kim_barcodes
    execution:
      scheduler: slurm
      load_modules: true
      python: python3
    manifest_fastq_dirs:
      E1_MGX_fastq_stems: /path/to/E1_mgx_fastq
      fastq_stems_E2_mg: /path/to/E2_mgx_fastq
    output_dirs:
      breseq: E1_mgx/breseq
      rebreseq: E1_mgx/rebreseq
      timecourse: timecourse_files
      slurm_logs: slurm_logs
    python2:
      executable: python
    trimmomatic:
      jar: /path/to/Trimmomatic-0.36/trimmomatic-0.36.jar
      adapters: /path/to/Trimmomatic-0.36/adapters/TruSeq2-PE.fa
    breseq:
      path: /path/to/breseq-0.35.7/bin/breseq
      gdtools: /path/to/breseq-0.35.7/bin/gdtools
    reference:
      genbank: /path/to/BtVPI-5482.gbk
      fasta: /path/to/BtVPI.fasta
      chromosome: NC_004663
    slurm:
      partition: normal
      trim: {time: "0:30:00", mem_per_cpu: 16G, cpus: 1}
      breseq: {time: "12:00:00", mem: 32G}
      rebreseq: {time: "12:00:00", mem: 32G}
      timecourse: {time: "2:00:00", mem: 10G}
    modules:
      R: R
      biology: biology
      samtools: samtools
      system: system
      ncurses: ncurses/6.0
      bowtie2: bowtie2
      numpy: ""
      scipy: ""
      gcc: gcc/14.2.0
    trimmomatic_params:
      illumina_clip: 2:30:10:2:keepBothReads
      leading: 3
      trailing: 3
      minlen: 36
    breseq_params:
      polymorphism_mode: true
      polymorphism_reject_indel_homopolymer_length: 0
      polymorphism_reject_surrounding_homopolymer_length: 0
      polymorphism_score_cutoff: 2
      polymorphism_minimum_variant_coverage_each_strand: 0
    timecourse_params:
      mpileup_quality: 10
      chunk_size: 50000
      genome_length: 6400000

